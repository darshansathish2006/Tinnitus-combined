# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service serves both the REST API and the built single-page app. They
# share an origin, which is what removes cross-origin configuration from the
# deployment: no CORS allow-list to keep in step with the frontend's URL, and no
# API address baked into the bundle at build time.
#
# Deploy: push this file, then New → Blueprint in the Render dashboard and point
# it at the repository.

services:
  - type: web
    name: echosense
    runtime: python
    plan: free
    # Nearest free region to the project's users. Change freely — nothing else
    # in this file depends on it.
    region: singapore

    buildCommand: bash ./build.sh
    # --chdir puts backend/ on sys.path as well as making it the working
    # directory, which is how `echosense.wsgi` resolves from the repository root.
    #
    # One worker, deliberately: the free instance has 512 MB, and NumPy, pandas,
    # scikit-learn and the loaded model bundle are most of that once. A second
    # worker would not fit, and an out-of-memory restart loop is a far worse
    # failure than queueing. Threads carry the concurrency instead — this
    # workload waits on the database and the model, not on the GIL.
    startCommand: >-
      gunicorn echosense.wsgi:application
      --chdir backend
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
      --access-logfile -

    healthCheckPath: /api/health

    envVars:
      # Signs JWTs as well as Django's own tokens. Generated once by Render and
      # never in the repository; settings.py refuses to boot without it when
      # DEBUG is off.
      - key: ECHOSENSE_SECRET_KEY
        generateValue: true

      # settings.py already defaults DEBUG off when RENDER is set. Stated
      # explicitly anyway, because "the debug setting of the production service"
      # should be readable here rather than inferred from application code.
      - key: ECHOSENSE_DEBUG
        value: "0"

      # Optional — the assistant falls back to its rules engine when unset, so
      # the deployment works without a key. Marked sync:false so Render prompts
      # for the value instead of it living in the repository.
      - key: ECHOSENSE_ANTHROPIC_API_KEY
        sync: false

    # Python version comes from .python-version at the repository root.

# --------------------------------------------------------------------------- #
# Persistence
# --------------------------------------------------------------------------- #
# As configured above the service runs on the SQLite file committed to the
# repository. That makes the deployment free and zero-infrastructure, and every
# restart returns the demo cohort to a known-good state — but Render's disk is
# ephemeral, so anything a user creates is lost when the instance restarts,
# which on the free plan also happens after 15 minutes of inactivity.
#
# For data that survives, uncomment the database below and its DATABASE_URL
# reference. settings.py reads DATABASE_URL with no code change, and build.sh
# seeds the demo cohort the first time it finds the database empty.
#
#   envVars:
#     - key: DATABASE_URL
#       fromDatabase:
#         name: echosense-db
#         property: connectionString
#
# databases:
#   - name: echosense-db
#     plan: free
#     databaseName: echosense
#     user: echosense
#
# Note: Render's free Postgres instances expire and are deleted after 30 days.
